<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mortex Frames - Watch Shows Online</title>
  <style>
    /* === GENERAL === */
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      color: white;
      overflow-x: hidden;
      background-image: url('Comp 1_00001.png');
      background-size: cover;
      background-position: center center;
      background-attachment: fixed;
      transition: background-color 0.3s ease;
    }

    .header {
      display: flex;
      justify-content: space-between;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.6);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
    }

    .header .logo {
      font-size: 30px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      color: #e50914;
    }

    .auth-buttons {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .auth-buttons button {
      padding: 10px 20px;
      background-color: #e50914;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    .auth-buttons button:hover {
      background-color: #b81e23;
    }

    #userInfo {
      display: none;
      align-items: center;
    }

    #userInfo img {
      border-radius: 50%;
      width: 70px;
      height: 70px;
      margin-right: 10px;
    }

    #userInfo span {
      font-weight: bold;
    }

    .hero {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .hero h1 {
      font-size: 60px;
      font-weight: bold;
      text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
      font-family: 'Arial Black', Arial, sans-serif;
    }

    .hero p {
      font-size: 24px;
      font-weight: bold;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
    }

    .hero .buttons {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .hero .buttons button {
      padding: 12px 30px;
      background-color: #e50914;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .hero .buttons button:hover {
      background-color: #b81e23;
    }

    .movie-row {
      margin-top: 20px;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.6);
    }

    .movie-row h2 {
      margin-bottom: 20px;
      font-size: 26px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
    }

    .movie-container {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      padding-bottom: 20px;
    }

    .movie {
      width: 250px;
      height: 375px;
      background-color: #bb2b2b;
      border-radius: 5px;
      position: relative;
      cursor: pointer;
      transition: transform 0.3s ease;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.7);
    }

    .movie:hover {
      transform: scale(1.05);
    }

    .movie img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 5px;
    }

    .down-arrow {
      width: 30px;
      height: 30px;
      border-left: 5px solid rgb(209, 42, 42);
      border-bottom: 5px solid rgb(185, 39, 39);
      margin: 20px auto;
      cursor: pointer;
      animation: bounce 1.5s infinite;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      50% { transform: translateY(10px); }
      100% { transform: translateY(0); }
    }

    #registerModal, #loginModal {
      display: none;
      background-color: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 30px;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 8px;
      width: 300px;
      animation: slideIn 0.5s ease-in-out;
    }

    @keyframes slideIn {
      from { transform: translate(-50%, -100%); }
      to { transform: translate(-50%, -50%); }
    }

    #registerModal input, #loginModal input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
    }

    #registerModal button, #loginModal button {
      width: 100%;
      padding: 10px;
      background-color: #e50914;
      color: white;
      border: none;
      border-radius: 5px;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: transparent;
      color: white;
      border: none;
      font-size: 20px;
      cursor: pointer;
    }

    /* === MEDIA QUERY === */
    @media screen and (max-width: 768px) {
      .header {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .auth-buttons {
        flex-direction: column;
        gap: 10px;
        margin-top: 10px;
      }

      .hero h1 {
        font-size: 36px;
      }

      .hero p {
        font-size: 18px;
      }

      .hero .buttons {
        flex-direction: column;
        gap: 15px;
      }

      .movie-container {
        gap: 10px;
      }

      .movie {
        width: 160px;
        height: 240px;
      }

      #userInfo img {
        width: 50px;
        height: 50px;
      }

      #registerModal, #loginModal {
        width: 90%;
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">
      <span class="vortex">MORTEX</span>
      <span class="media" style="color: white;">FRAMES</span>
    </div>
    <div class="auth-buttons">
      <button id="loginBtn" onclick="openLoginModal()">Log In</button>
      <button id="registerBtn" onclick="openRegisterModal()">Register</button>
      <button id="logoutBtn" style="display:none;" onclick="logout()">Log Out</button>
      <div id="userInfo">
        <img id="userAvatar" src="https://static.vecteezy.com/system/resources/previews/013/360/247/non_2x/default-avatar-photo-icon-social-media-profile-sign-symbol-vector.jpg" alt="User Avatar">
        <span id="username"></span>
      </div>
    </div>
  </div>

  <div class="hero">
    <div>
      <h1>Unlimited Movies <br> and TV Shows</h1>
      <p>Watch anytime, anywhere</p>
      <p style="position: absolute; top: 80%; left: 50%; transform: translateX(-50%);">Let's get started!</p>
      <div class="buttons">
        <button onclick="openAboutUsModal()">About Us</button>
        <button onclick="openUploadMovieModal()">Watch Movies For Free</button>
      </div>
    </div>
  </div>

  <div class="movie-row">
    <h2>Trending Now</h2>
    <div class="movie-container">
      <div class="movie"><img src="https://via.placeholder.com/200x300?text=Movie+1"></div>
      <div class="movie"><img src="https://via.placeholder.com/200x300?text=Movie+2"></div>
      <div class="movie"><img src="https://via.placeholder.com/200x300?text=Movie+3"></div>
      <div class="movie"><img src="https://via.placeholder.com/200x300?text=Movie+4"></div>
      <div class="movie"><img src="https://via.placeholder.com/200x300?text=Movie+5"></div>
      <div class="movie"><img src="https://via.placeholder.com/200x300?text=Movie+6"></div>
    </div>
  </div>

  <div class="down-arrow" onclick="scrollToSection()"></div>

  <!-- Register Modal -->
  <div id="registerModal">
    <button class="close-btn" onclick="closeRegisterModal()">×</button>
    <h2>Register</h2>
    <input type="text" id="registerUsername" placeholder="Username">
    <input type="password" id="registerPassword" placeholder="Password">
    <button onclick="register()">Register</button>
  </div>

  <!-- Login Modal -->
  <div id="loginModal">
    <button class="close-btn" onclick="closeLoginModal()">×</button>
    <h2>Login</h2>
    <input type="text" id="loginUsername" placeholder="Username">
    <input type="password" id="loginPassword" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>

  <script>
    function scrollToSection() {
      document.querySelector('.movie-row').scrollIntoView({ behavior: 'smooth' });
    }

    window.onload = function() {
      const storedUsername = localStorage.getItem("username");
      if (storedUsername) {
        document.getElementById("userInfo").style.display = "flex";
        document.getElementById("username").innerText = storedUsername;
        document.getElementById("loginBtn").style.display = "none";
        document.getElementById("logoutBtn").style.display = "inline-block";
      }
    };

    function openRegisterModal() {
      document.getElementById("registerModal").style.display = "block";
    }

    function closeRegisterModal() {
      document.getElementById("registerModal").style.display = "none";
    }

    function openLoginModal() {
      document.getElementById("loginModal").style.display = "block";
    }

    function closeLoginModal() {
      document.getElementById("loginModal").style.display = "none";
    }

    function register() {
      const username = document.getElementById("registerUsername").value;
      const password = document.getElementById("registerPassword").value;
      if (username && password) {
        localStorage.setItem("username", username);
        localStorage.setItem("password", password);
        alert("Registration successful! Please log in.");
        closeRegisterModal();
        openLoginModal();
      } else {
        alert("Please fill in both fields.");
      }
    }

    function login() {
      const username = document.getElementById("loginUsername").value;
      const password = document.getElementById("loginPassword").value;
      const storedUsername = localStorage.getItem("username");
      const storedPassword = localStorage.getItem("password");

      if (username === storedUsername && password === storedPassword) {
        document.getElementById("userInfo").style.display = "flex";
        document.getElementById("username").innerText = username;
        document.getElementById("loginBtn").style.display = "none";
        document.getElementById("logoutBtn").style.display = "inline-block";
        closeLoginModal();
      } else {
        alert("Invalid credentials. Please try again.");
      }
    }

    function logout() {
      localStorage.removeItem("username");
      localStorage.removeItem("password");
      document.getElementById("userInfo").style.display = "none";
      document.getElementById("loginBtn").style.display = "inline-block";
      document.getElementById("logoutBtn").style.display = "none";
      alert("logged out successfully!")
    }

  // Add the modal content inside the modal background

}

// Function to close the modal
function closeAboutUsModal() {
  // Find the modal and remove it from the DOM
  const modal = document.querySelector('div[style*="position: fixed"]');
  if (modal) {
    modal.remove();
  }
}

  </script>
  


</body>
</html>
